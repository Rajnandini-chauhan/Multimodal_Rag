
services:
  postgres:
    image: postgres:17
    container_name: paperqa_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: paperqa
      POSTGRES_PASSWORD: paperqa
      POSTGRES_DB: paperqa

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperqa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paperqa_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: paperqa_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - paper_storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: paperqa_worker
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    command: >
      celery
      -A app.core.celery_app
      worker
      --loglevel=info

    volumes:
      - ./backend:/app
      - paper_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: paperqa_frontend
    restart: unless-stopped

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  paper_storage: